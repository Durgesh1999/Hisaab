  // inline new friend
  $$('select[name=friendId]', w).forEach(sel => sel.addEventListener('change', () => {
    if (sel.value === '__new') { sel.value = ''; openFriendForm(null, f => { sel.innerHTML = friendOptions(f.id); sel.value = f.id; sel.dispatchEvent(new Event('change')); }); }
  }));
  // receipt upload
  const rf = $('#rcptFile', w);
  if (rf) rf.onchange = async () => {
    const file = rf.files[0]; if (!file) return;
    if (file.size > 8 * 1024 * 1024) { $('#rcptHint', w).textContent = 'File is larger than 8 MB.'; return; }
    $('#rcptHint', w).innerHTML = '<span class="spinner"></span>Uploading to Google Drive…';
    const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
    try { const d = await call('uploadReceipt', { name: file.name, mimeType: file.type, data: b64 }, uuid()); F('receiptUrl').value = d.url; $('#rcptHint', w).innerHTML = '<span class="ok-text">Uploaded to Drive ✓</span>'; }
    catch (e) { $('#rcptHint', w).innerHTML = `<span class="bad-text">${esc(e.message)}</span>`; }
  };

  let split = null, alloc = null;
  if (type === 'shared') split = mountSplitUI($('#splitUI', w), form, t, prefill);
  if (type === 'repayment') alloc = mountAllocUI($('#allocUI', w), form, w, t);

  $('[data-save]', w).onclick = async e => {
    const btn = e.currentTarget;
    const p = { id: t.id || undefined, type, amount: Number(F('amount').value), date: F('date').value, description: F('description') ? F('description').value : '', notes: F('notes').value, accountId: F('accountId').value };
    if (!p.accountId) return showErr(ctx, 'Choose an account.');
    if (F('payee')) p.payee = F('payee').value.trim();
    if (type === 'income') { p.source = F('source').value.trim(); if (!p.source) return showErr(ctx, 'Say where the money came from (e.g. Salary).'); }
    if (type === 'transfer') { p.toAccountId = F('toAccountId').value; if (!p.toAccountId || p.toAccountId === p.accountId) return showErr(ctx, 'Pick two different accounts.'); }
    if (!(p.amount > 0)) return showErr(ctx, 'Enter an amount greater than zero.');
    if (!p.date) return showErr(ctx, 'Choose a date.');
    if ((type === 'expense' || type === 'shared') && !F('category').value) return showErr(ctx, 'Choose a category.');
    if (type === 'shared' && !p.description.trim()) return showErr(ctx, 'Add a description for the shared expense.');
    if (type === 'expense' || type === 'shared') { p.category = F('category').value; p.subcategory = ''; p.receiptUrl = F('receiptUrl').value; }
    if (type === 'expense') { p.paymentMethod = F('paymentMethod').value; if (F('recEnabled')) p.recurring = { enabled: F('recEnabled').checked, freq: F('recFreq').value, interval: Number(F('recInterval').value) || 1, endDate: F('recEnd').value }; }
    if (type === 'shared') {
      const sp = split.payload(); if (sp.error) return showErr(ctx, sp.error); Object.assign(p, sp);
      p.dueDate = F('dueDate').value; p.reminderDate = p.dueDate; p.reminderFreq = 'weekly';
      if (p.dueDate && p.dueDate < p.date) return showErr(ctx, 'The pay-back date is before the bill date.');
    }
    if (type === 'lent' || type === 'borrowed') {
      Object.assign(p, { friendId: F('friendId').value, dueDate: F('dueDate').value, reminderDate: F('dueDate').value, reminderFreq: 'weekly', notifyFriend: F('notifyFriend') ? F('notifyFriend').checked : false });
      if (!p.friendId) return showErr(ctx, 'Choose a friend.');
      const it = existing && itemsFor(t.id)[0];
      if (it && it.settled > 0 && p.amount + 0.004 < it.settled) return showErr(ctx, money(it.settled) + ' has already been repaid, so the amount can\'t be lower than that.');
      if (it && it.settled > 0 && p.friendId !== t.friendId) return showErr(ctx, 'Some money is already paid back, so the person can\'t be changed.');
      if (p.dueDate && p.dueDate < p.date) return showErr(ctx, 'The return date is before the date you gave the money.');
    }
    if (type === 'repayment') { const ap = alloc.payload(); if (ap.error) return showErr(ctx, ap.error); Object.assign(p, ap, { paymentMethod: F('paymentMethod').value }); }
    try { await save(btn, 'saveTransaction', p, ctx); closeSheet(w); } catch (err) { /* shown inline */ }
  };
  const del = $('[data-del]', w);
  if (del) del.onclick = async () => {
    if (t.type !== 'repayment' && S.d.allocations.some(a => a.targetTxnId === t.id)) return showErr(ctx, 'This entry has repayments linked to it. Delete those repayments first so balances stay accurate.');
    if (!(await confirmSheet('Delete this transaction?', 'It will be removed from all balances and charts. The row is kept in your Google Sheet, marked as deleted, so history is preserved.', 'Delete', true))) return;
    try { await save(del, 'deleteTransaction', { id: t.id }, { errEl: ctx.errEl }, 'Deleted ✓'); closeSheet(w); } catch (e) { }
  };
  setTimeout(() => { if (!existing && F('amount')) F('amount').focus(); }, 200);
}
function showErr(ctx, msg, hint) { ctx.errEl.innerHTML = `<div class="err-box">${esc(msg)}${hint ? `<div class="err-hint">${esc(hint)}</div>` : ''}</div>`; ctx.errEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }

/* split calculator (client-side preview; the server recomputes authoritatively) */
function distribute(cents, weights) {
  const W = weights.reduce((a, b) => a + b, 0); if (W <= 0) return null;
  const raw = weights.map(w => cents * w / W), fl = raw.map(Math.floor);
  let rem = cents - fl.reduce((a, b) => a + b, 0);
  const idx = raw.map((_, i) => i).sort((a, b) => (raw[b] - fl[b]) - (raw[a] - fl[a]) || a - b);
  for (let i = 0; i < rem; i++) fl[idx[i % idx.length]]++;
  return fl;
}
function mountSplitUI(el, form, t, prefill) {
  const st = { people: [], method: t.splitMethod || 'equal', values: {}, payMode: 'me', payer: 'me', paid: {} };
  if (t.splits) {
    t.splits.forEach(s => { if (s.share > 0 || s.splitValue > 0) { st.people.push(s.personId); st.values[s.personId] = s.splitValue; } st.paid[s.personId] = s.paid; });
    const payers = t.splits.filter(s => s.paid > 0);
    if (payers.length > 1) st.payMode = 'multiple'; else if (payers.length) { st.payer = payers[0].personId; st.payMode = 'single'; }
    if (st.method === 'exact') t.splits.forEach(s => st.values[s.personId] = s.share);
  } else {
    st.people = ['me']; if (prefill.friendId) st.people.push(prefill.friendId); st.payMode = 'single';
  }
  if (st.payMode === 'me') st.payMode = 'single';
  const total = () => Number(form.elements.amount.value) || 0;
  function shares() {
    const T = Math.round(total() * 100), ps = st.people;
    if (!ps.length) return { arr: [], ok: false, msg: 'Pick who is splitting.' };
    if (st.method === 'equal') return { arr: distribute(T, ps.map(() => 1)).map(c => c / 100), ok: T > 0 };
    if (st.method === 'exact') { const arr = ps.map(p => r2(Number(st.values[p]) || 0)); const s = sum(arr); return { arr, ok: Math.abs(s - total()) < 0.005, msg: `Exact amounts total ${money(s)} of ${money(total())} (${money(r2(total() - s))} left).` }; }
    if (st.method === 'percent') { const v = ps.map(p => Number(st.values[p]) || 0); const s = v.reduce((a, b) => a + b, 0); const d = distribute(T, v); return { arr: d ? d.map(c => c / 100) : ps.map(() => 0), ok: Math.abs(s - 100) < 0.01, msg: `Percentages total ${r2(s)}% (must be 100%).` }; }
    const v = ps.map(p => st.values[p] === undefined || st.values[p] === '' ? 1 : Number(st.values[p]) || 0); const d = distribute(T, v);
    return { arr: d ? d.map(c => c / 100) : ps.map(() => 0), ok: !!d, msg: 'Shares must be greater than zero.' };
  }
  function draw() {
    const friends = S.d.friends.filter(f => f.active || st.people.includes(f.id)).sort((a, b) => a.name.localeCompare(b.name));
    const sh = shares();
    const everyone = ['me', ...friends.map(f => f.id)];
    const paidSum = sum(st.people.concat(Object.keys(st.paid).filter(p => !st.people.includes(p))), p => st.paid[p] || 0);
    const payerChoices = ['me', ...st.people.filter(p => p !== 'me'), ...friends.map(f => f.id).filter(id => !st.people.includes(id))];
    el.innerHTML = `<div class="f"><label>Who's splitting?</label><div class="pchips">${everyone.map(id => `<button type="button" class="pchip ${st.people.includes(id) ? 'on' : ''}" data-p="${id}">${avatar(id === 'me' ? null : D.friendMap[id])}${esc(id === 'me' ? 'Me' : D.friendMap[id].name)}</button>`).join('')}<button type="button" class="pchip" data-newf>＋ New friend</button></div></div>
    <div class="f"><label>Paid by</label><select class="in" id="payerSel">${payerChoices.map(id => `<option value="${id}" ${st.payMode === 'single' && st.payer === id ? 'selected' : ''}>${esc(id === 'me' ? 'Me — I paid the whole bill' : friendName(id))}</option>`).join('')}<option value="__multi" ${st.payMode === 'multiple' ? 'selected' : ''}>Multiple people contributed</option></select></div>
    ${st.payMode === 'multiple' ? `<div class="card" style="padding:6px 14px">${[...new Set(['me', ...st.people, ...Object.keys(st.paid).filter(k => st.paid[k] > 0)])].map(p => `<div class="split-row"><span class="grow">${esc(friendName(p))} paid</span><input class="in num" type="number" inputmode="decimal" step="0.01" data-paid="${p}" value="${st.paid[p] || ''}" placeholder="0"></div>`).join('')}</div>
      <div class="hint ${Math.abs(paidSum - total()) < 0.005 ? 'ok-text' : 'bad-text'}">Paid ${money(paidSum)} of ${money(total())}</div>` : ''}
    <div class="f"><label>Split</label><div class="seg">${[['equal', 'Equally'], ['exact', 'Exact'], ['percent', '%'], ['shares', 'Shares']].map(([k, l]) => `<button type="button" data-m="${k}" class="${st.method === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
    <div class="card" style="padding:6px 14px;margin-top:10px">${st.people.map((p, i) => `<div class="split-row">${avatar(p === 'me' ? null : D.friendMap[p])}<span class="grow ellipsis">${esc(friendName(p))}</span>
      ${st.method === 'equal' ? '' : `<input class="in num" type="number" inputmode="decimal" step="${st.method === 'shares' ? '1' : '0.01'}" data-v="${p}" value="${st.values[p] !== undefined ? st.values[p] : (st.method === 'shares' ? 1 : '')}" placeholder="${st.method === 'percent' ? '%' : st.method === 'shares' ? 'shares' : '0'}">`}
      <b class="num" style="min-width:76px;text-align:right">${money(sh.arr[i] || 0)}</b></div>`).join('') || '<div class="empty">Pick people above.</div>'}</div>
    <div class="hint ${sh.ok ? '' : 'bad-text'}" id="splitMsg">${sh.ok ? summaryLine(sh) : esc(sh.msg || '')}</div>`;
    $$('[data-p]', el).forEach(b => b.onclick = () => { const id = b.dataset.p; st.people = st.people.includes(id) ? st.people.filter(x => x !== id) : [...st.people, id]; draw(); });
    $('[data-newf]', el).onclick = () => openFriendForm(null, f => { st.people.push(f.id); draw(); });
    $('#payerSel', el).onchange = e => { const v = e.target.value; if (v === '__multi') { st.payMode = 'multiple'; } else { st.payMode = 'single'; st.payer = v; } draw(); };
    $$('[data-m]', el).forEach(b => b.onclick = () => { st.method = b.dataset.m; st.values = {}; draw(); });
    $$('[data-v]', el).forEach(inp => inp.oninput = () => { st.values[inp.dataset.v] = inp.value; refresh(); });
    $$('[data-paid]', el).forEach(inp => inp.oninput = () => { st.paid[inp.dataset.paid] = Number(inp.value) || 0; refresh(); });
  }
  function summaryLine(sh) {
    const myIdx = st.people.indexOf('me'); const myShare = myIdx > -1 ? sh.arr[myIdx] : 0;
    const myPaid = st.payMode === 'single' ? (st.payer === 'me' ? total() : 0) : (st.paid.me || 0);
    const diff = r2(myPaid - myShare);
    return `Your share: <b>${money(myShare)}</b> (counts as your spending). ${diff > 0 ? `You're owed <b class="pos">${money(diff)}</b>.` : diff < 0 ? `You owe <b class="neg">${money(-diff)}</b>.` : ''}`;
  }
  let rt; function refresh() { clearTimeout(rt); rt = setTimeout(() => { const a = document.activeElement; const key = a && (a.dataset.v || a.dataset.paid); const kind = a && (a.dataset.v ? 'v' : 'paid'); const pos = a && a.selectionStart; draw(); if (key) { const n = $(`[data-${kind}="${key}"]`, el); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } } } }, 350); }
  form.elements.amount.addEventListener('input', () => refresh());
  draw();
  return {
    payload() {
      const sh = shares();
      if (!st.people.length) return { error: 'Pick who is splitting the bill.' };
      if (!sh.ok) return { error: sh.msg };
      const payers = st.payMode === 'single' ? [{ personId: st.payer, amount: total() }] : Object.keys(st.paid).filter(k => st.paid[k] > 0).map(k => ({ personId: k, amount: st.paid[k] }));
      if (st.payMode === 'multiple' && Math.abs(sum(payers, x => x.amount) - total()) > 0.005) return { error: 'Amounts paid must add up to the total.' };
      const ids = new Set([...st.people, ...payers.map(p => p.personId)]);
      if (!ids.has('me')) return { error: 'Include yourself as a participant or payer.' };
      if (ids.size < 2) return { error: 'Add at least one friend.' };
      return { splitMethod: st.method, participants: st.people.map(p => ({ personId: p, value: st.method === 'shares' ? (st.values[p] === undefined || st.values[p] === '' ? 1 : Number(st.values[p])) : Number(st.values[p]) || 0 })), payers };
    }
  };
}

/* repayment allocation UI */
function mountAllocUI(el, form, w, t) {
  const st = { manual: {}, editingId: t.id || null };
  if (t.id) S.d.allocations.filter(a => a.repaymentId === t.id).forEach(a => st.manual[a.targetTxnId] = a.amount);
  const F = n => form.elements[n];
  function openItems() {
    const dir = F('direction').value === 'received' ? 'receivable' : 'payable', fid = F('friendId').value;
    if (!fid) return [];
    return S.d.ledger.filter(i => i.friendId === fid && i.direction === dir).map(i => {
      // When editing, add back this repayment's own allocation so it can be re-allocated.
      const own = st.editingId ? sum(i.allocations.filter(a => a.repaymentId === st.editingId), a => a.amount) : 0;
      return Object.assign({}, i, { avail: r2(i.outstanding + own) });
    }).filter(i => i.avail > 0.004).sort((a, b) => (b.overdue - a.overdue) || (a.date < b.date ? -1 : 1));
  }
  function draw() {
    const items = openItems(), amt = Number(F('amount').value) || 0;
    const totalOpen = sum(items, i => i.avail);
    const allocated = sum(items, i => st.manual[i.txnId] || 0);
    if (!F('friendId').value) { el.innerHTML = '<div class="hint">Choose a friend to see what can be settled.</div>'; return; }
    if (!items.length) { el.innerHTML = `<div class="alert info">Nothing is outstanding ${F('direction').value === 'received' ? 'from' : 'to'} ${esc(friendName(F('friendId').value))} in this direction.</div>`; return; }
    el.innerHTML = `<div class="section" style="margin-top:14px"><h2>Apply to</h2><button type="button" class="link" data-auto>Auto-fill oldest first</button></div>
    <div class="card" style="padding:6px 14px">${items.map(i => `<div class="split-row"><div class="grow"><div class="ellipsis" style="font-weight:600">${esc(i.description || (i.kind === 'loan' ? 'Money lent' : 'Shared bill'))}</div><div class="tiny muted">${i.kind === 'loan' ? (i.direction === 'receivable' ? 'Lent' : 'Borrowed') : 'Shared bill'} · ${fmtDate(i.date)} · ${money(i.avail)} open ${i.overdue ? '<span class="tag overdue">Late</span>' : ''}</div></div>
      <input class="in num" type="number" inputmode="decimal" step="0.01" min="0" max="${i.avail}" data-a="${i.txnId}" value="${st.manual[i.txnId] || ''}" placeholder="0"></div>`).join('')}</div>
    <div class="hint" id="allocMsg"></div>
    <div class="hint">Total open: <b>${money(totalOpen)}</b>. Leave all blank to auto-apply oldest (overdue) items first.</div>`;
    msg();
    $('[data-auto]', el).onclick = () => { let left = Number(F('amount').value) || 0; st.manual = {}; items.forEach(i => { const a = r2(Math.min(left, i.avail)); if (a > 0) { st.manual[i.txnId] = a; left = r2(left - a); } }); draw(); };
    $$('[data-a]', el).forEach(inp => inp.oninput = () => { st.manual[inp.dataset.a] = Number(inp.value) || 0; msg(); });
  }
  function msg() {
    const items = openItems(), amt = Number(F('amount').value) || 0, allocated = sum(items, i => st.manual[i.txnId] || 0), totalOpen = sum(items, i => i.avail);
    const m = $('#allocMsg', el); if (!m) return;
    if (amt > totalOpen + 0.004) m.innerHTML = `<span class="bad-text">That's ${money(amt - totalOpen)} more than is outstanding.</span>`;
    else if (allocated > 0) m.innerHTML = `<span class="${Math.abs(allocated - amt) < 0.005 ? 'ok-text' : 'bad-text'}">Allocated ${money(allocated)} of ${money(amt)}</span>`;
    else m.innerHTML = amt > 0 ? `Will auto-apply ${money(amt)}.` : '';
  }
  $$('#dirSeg button', w).forEach(b => b.onclick = () => { $$('#dirSeg button', w).forEach(x => x.classList.toggle('on', x === b)); F('direction').value = b.dataset.dir; $('#frLbl', w).textContent = b.dataset.dir === 'received' ? 'From' : 'To'; st.manual = {}; draw(); });
  F('friendId').addEventListener('change', () => { st.manual = {}; draw(); });
  F('amount').addEventListener('input', msg);
  draw();
  return {
    payload() {
      if (!F('friendId').value) return { error: 'Choose a friend.' };
      const items = openItems(), amt = Number(F('amount').value) || 0;
      const allocations = items.filter(i => (st.manual[i.txnId] || 0) > 0).map(i => ({ targetTxnId: i.txnId, amount: r2(st.manual[i.txnId]) }));
      for (const a of allocations) { const i = items.find(x => x.txnId === a.targetTxnId); if (a.amount > i.avail + 0.004) return { error: `"${i.description}" only has ${money(i.avail)} outstanding.` }; }
      if (allocations.length && Math.abs(sum(allocations, a => a.amount) - amt) > 0.005) return { error: 'Allocations must add up to the repayment amount.' };
      if (amt > sum(items, i => i.avail) + 0.004) return { error: 'This is more than the outstanding balance. Each balance can only be settled once.' };
      return { direction: F('direction').value, friendId: F('friendId').value, allocations };
    }
  };
}

/* ── Transaction detail ── */
function openTxnDetail(id) {

  }
  if (t.type === 'lent' || t.type === 'borrowed') {

    ${i.allocations.length ? `<div class="section"><h2>Money paid back</h2></div><div class="list">${i.allocations.map(a => { const r = D.txnMap[a.repaymentId]; return `<button class="item" data-act="txn" data-id="${a.repaymentId}"><div class="ic">${ic('handshake')}</div><div class="grow"><div class="t">${r ? fmtDate(r.date) : ''}</div><div class="s">${r && r.paymentMethod ? esc(r.paymentMethod) : 'Repayment'}</div></div><div class="amt num">${money(a.amount)}</div></button>`; }).join('')}</div>` : ''}
    ${i.outstanding > 0 ? `<button class="btn primary block" style="margin-top:12px" data-act="settle" data-id="${t.friendId}" data-dir="${t.type === 'lent' ? 'received' : 'paid'}" data-target="${t.id}">Got money back</button>` : ''}`;
  }

    const al = S.d.allocations.filter(a => a.repaymentId === t.id);

function showConnect(msg, needPasscode) {
  closeAllSheets();
  S.d = null; S.view = 'home'; S.stack = [];
  $('#title').textContent = APP_NAME; $('#backBtn').hidden = true;
  const preset = (window.HISAAB_CONFIG && window.HISAAB_CONFIG.apiUrl) || '';
  $('#view').innerHTML = `<div class="card" style="margin-top:6px">
    <h2 style="margin:0 0 4px;font-size:20px">Connect your Google Sheet</h2>
    <p class="small muted" style="margin:0">Paste your Web app URL once. After that the app opens straight to your dashboard.</p>
    <form id="connForm" autocomplete="on" novalidate>
      <div class="f"><label for="cUrl">Web app URL</label><input class="in" id="cUrl" name="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(CONN.url || preset)}" ${preset && !store.get('apiUrl') ? '' : ''}></div>
      <div class="f" id="tokRow" ${needPasscode ? '' : 'hidden'}><label for="cTok">Passcode</label><input class="in" id="cTok" name="password" type="password" autocomplete="current-password" placeholder="xxxx-xxxx-xxxx-xxxx" value=""></div>
      <label class="toggle small" id="remRow" ${needPasscode ? '' : 'hidden'}><span>Remember on this device</span><span class="switch"><input type="checkbox" id="cRemember" checked><span></span></span></label>
      <div id="connErr">${msg ? `<div class="err-box">${esc(msg)}</div>` : ''}</div>
      <button class="btn primary block" style="margin-top:12px" id="connBtn" type="submit">Connect</button>
    </form>
    <div class="hint" style="margin-top:12px">Find it in Apps Script under <b>Deploy → Manage deployments</b> (Web app URL ending in /exec). You only do this once per device.</div>
  </div>`;
  $('#connForm').onsubmit = async e => {
    e.preventDefault();
    const url = $('#cUrl').value.trim(), tok = $('#cTok').value.trim(), btn = $('#connBtn'), err = $('#connErr');
    const remember = !!($('#cRemember') && $('#cRemember').checked);
    err.innerHTML = '';
    if (!validApiUrl(url)) { err.innerHTML = `<div class="err-box">That URL doesn't look right. It should start with https://script.google.com/ and end with /exec.</div>`; return; }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Checking backend';
    try {
      const ping = await rawPost(url, { action: 'ping' });
      if (!ping.ok || ping.app !== 'Hisaab') throw new Error('That URL answered, but it is not the Hisaab backend.');
      openMode = ping.requiresPasscode === false;
      if (!openMode && !tok) { $('#tokRow').hidden = false; $('#remRow').hidden = false; $('#cTok').focus(); throw new Error('This backend needs your passcode. Enter it above.'); }
      btn.innerHTML = '<span class="spinner"></span>Loading your data';
      CONN.url = url; CONN.token = tok; sessionToken = tok;
      await call('getAll');
      store.set('apiUrl', url);
      store.set('token', remember ? tok : '');
      toast('Connected to Google Sheets ✓');
      afterLoad();
    } catch (x) {
      if (!S.d) { CONN.token = ''; sessionToken = ''; }
      if ($('#connErr')) $('#connErr').innerHTML = `<div class="err-box">${esc(x.message)}</div>`;
      if ($('#connBtn')) { $('#connBtn').disabled = false; $('#connBtn').textContent = 'Connect'; }
    }
  };
}
function afterLoad() {
  // Resume any changes saved on this device that hadn't reached Google yet (e.g. the tab was closed).
  const q = loadQueue();
  if (q.length && !SYNC.pending.length) { q.forEach(o => SYNC.pending.push(Object.assign({ tries: 0 }, o))); refreshView(); pump(); }
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  if (tz && S.d && !S.d.settings.timezone) call('saveSettings', { timezone: tz }, 'tz-' + tz).catch(() => { });
}
function signOut() { store.set('token', ''); CONN.token = ''; sessionToken = ''; openMode = false; showConnect(); setSync('err', 'Signed out'); }
async function runDiagnostics(btn) {
  btn.disabled = true; const label = btn.textContent; btn.innerHTML = '<span class="spinner"></span>Testing';
  const rows = [];
  const t0 = performance.now();
  try { const p = await rawPost(CONN.url, { action: 'ping' }); rows.push({ name: 'Backend reachable', ok: !!p.ok, detail: Math.round(performance.now() - t0) + ' ms · API v' + (p.apiVersion || '?') }); }
  catch (e) { rows.push({ name: 'Backend reachable', ok: false, detail: e.message }); }
  try { const d = await call('selfTest', {}, ''); (d.checks || []).forEach(c => rows.push(c)); }
  catch (e) { rows.push({ name: 'Passcode accepted', ok: false, detail: e.message }); }
  const t1 = performance.now();
  try { await call('getAll'); rows.push({ name: 'Full data load', ok: true, detail: Math.round(performance.now() - t1) + ' ms · ' + S.d.transactions.length + ' transactions' }); }
  catch (e) { rows.push({ name: 'Full data load', ok: false, detail: e.message }); }
  const pass = rows.every(r => r.ok);
  const out = $('#diagOut'); // re-query: loading data redraws the page
  if (!out) return;
  out.innerHTML = `<div class="alert ${pass ? 'info' : 'neg'}" style="margin-top:0">${pass ? '✅ Everything is working.' : '⚠️ Some checks failed — see below.'}</div>` +
    rows.map(r => `<div class="kv"><span class="hc ${r.ok ? 'ok' : 'bad'}">${ic(r.ok ? 'check' : 'close', 15)} ${esc(r.name)}</span><span class="small" style="font-weight:500">${esc(r.detail)}</span></div>`).join('');
  if (btn.isConnected) { btn.disabled = false; btn.textContent = label; }
}
async function boot() {
  loadConn();
  if (CONN.url && !CONN.token) {
    // No passcode stored: ask the backend whether it needs one. If not, open straight to the dashboard.
    try { const p = await rawPost(CONN.url, { action: 'ping' }); openMode = !!(p.ok && p.requiresPasscode === false); } catch (e) { openMode = true; }
  }
  if (!connected()) { setSync('err', 'Not connected'); showConnect(); return; }
  for (let attempt = 0; attempt < 3; attempt++) {
    try { await call('getAll'); afterLoad(); return; }
    catch (e) {
      if ($('#connForm')) return; // backend asked for a passcode → connect screen already shown
      if (attempt === 2) { $('#view').innerHTML = `<div class="card" style="margin-top:10px"><h2 style="margin-top:0">Couldn't load your data</h2><p>${esc(e.message)}</p><div class="row" style="gap:10px"><button class="btn primary grow" onclick="location.reload()">Try again</button><button class="btn" onclick="signOut()">Change connection</button></div></div>`; }
      else await new Promise(r => setTimeout(r, 1200 * (attempt + 1)));
    }
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.d && !sheetStack.length && !SYNC.pending.length) call('getAll').catch(() => { }); });
boot();
</script>
</body>
</html>
