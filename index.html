<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<script>
/* Pick the layout before first paint: Auto (by screen width), Phone, or Laptop — remembered per device. */
(function () {
  var mode = 'auto';
  try { mode = localStorage.getItem('hisaab.layout') || 'auto'; } catch (e) {}
  var wide = window.matchMedia && window.matchMedia('(min-width:1000px)').matches;
  if (mode === 'laptop' || (mode === 'auto' && wide)) document.documentElement.classList.add('lap');
  document.documentElement.setAttribute('data-layout', mode);
})();
</script>
<meta name="theme-color" content="#FAF9F6">
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23F2C230'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23000' font-family='Arial' font-weight='700'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Malkin's Tijori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Yellow is the brand, but only ever in small doses: the add button, the active tab,
   primary actions and progress bars. Large areas stay neutral so the screen is restful. */
:root{
  --bg:#FAF9F6; --surface:#FFFFFF; --surface2:#F4F2EC; --ink:#232220; --ink2:#5A574F; --muted:#8A867C; --line:#E9E6DE;
  --brand:#F2C230; --brand-strong:#E0AE1B; --brand-ink:#1A1A1A; --brand-text:#7A6210; --accent:#F2C230; --pink:#C96A7E;
  --pos:#2E7D55; --pos-bg:#EAF3EE; --neg:#C0544B; --neg-bg:#FAEDEB; --warn:#8A6514; --warn-bg:#FAF2E0; --info-bg:#F4F2EC;
  --grad:linear-gradient(135deg,#F2C230 0%,#E0AE1B 100%);
  --shadow:0 1px 2px rgba(35,34,32,.04);
  --radius:16px; --radius-sm:10px;
  --display:"Figtree","Plus Jakarta Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#161513; --surface:#1E1D1A; --surface2:#2A2825; --ink:#EDEAE2; --ink2:#AEA99C; --muted:#7E7A70; --line:#33312C;
    --brand:#E8BC3C; --brand-strong:#F2C230; --brand-ink:#1A1A1A; --brand-text:#E8BC3C; --accent:#E8BC3C; --pink:#D98A9C;
    --pos:#6BBE8C; --pos-bg:#1B2E23; --neg:#E08B82; --neg-bg:#332020; --warn:#D9AC5A; --warn-bg:#302716; --info-bg:#2A2825;
    --grad:linear-gradient(135deg,#E8BC3C 0%,#D1A52E 100%);
    --shadow:0 1px 2px rgba(0,0,0,.25); --radius:16px; --radius-sm:10px; color-scheme:dark; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree","Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-text)}
.num{font-variant-numeric:tabular-nums}
#app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:16px 16px 12px;display:flex;align-items:center;gap:10px}
.topbar h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:transparent;width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:18px;display:grid;place-items:center;color:var(--ink)}
.back:hover{background:var(--surface2)}
[hidden]{display:none!important}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pos)}
.dot.busy{background:var(--accent);animation:pulse 1s infinite}
.dot.err{background:var(--neg)}
@keyframes pulse{50%{opacity:.3}}
main{padding:0 16px}
.section{margin:24px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.section h2{font-size:13px;font-weight:600;margin:0;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.section .link{font-size:13px;font-weight:600;color:var(--ink2);background:none;border:0;cursor:pointer;padding:4px}
.section .link:hover{color:var(--ink)}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;border:1px solid var(--line)}
.card + .card{margin-top:12px}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* period chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.custom-range{display:flex;gap:8px;margin-top:6px}
.custom-range input{flex:1}

/* hero + stat cards */
.hero{background:var(--ink);color:var(--bg);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
.hero:after{content:none}
.hero .label{font-size:11.5px;opacity:.6;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.hero .big{font-size:32px;font-weight:700;letter-spacing:-.03em;margin:6px 0 2px}
.hero .sub{font-size:13px;opacity:.6}
.hero .pill{display:inline-block;margin-top:10px;background:rgba(255,255,255,.1);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
@media(min-width:620px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{background:var(--surface);border-radius:var(--radius);padding:14px;cursor:pointer;border:1px solid var(--line);text-align:left;min-width:0}
.stat .k{font-size:12.5px;font-weight:500;color:var(--ink2);text-transform:none;letter-spacing:0;display:flex;gap:7px;align-items:center}
.stat .v{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.tag.actual{background:var(--pos-bg);color:var(--pos)} .tag.calc{background:var(--info-bg);color:var(--ink2)} .tag.est{background:var(--warn-bg);color:var(--warn)}
.tag.overdue{background:var(--neg-bg);color:var(--neg)}
.tag.saving{background:var(--info-bg);color:var(--ink2);animation:pulse 1.2s infinite} .tag.neutral{background:var(--surface2);color:var(--ink2)}

/* bars */
.bar{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--ink)}
.bar > i.over{background:var(--neg)} .bar > i.hi{background:var(--warn)}
.brow{padding:9px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .top{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:6px}

/* donut */
.donut-wrap{position:relative;max-width:260px;margin:0 auto}
.donut-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donut-center b{display:block;font-size:20px;letter-spacing:-.02em}
.legend{margin-top:12px}
.legend button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:8px 2px;cursor:pointer;text-align:left;border-bottom:1px solid var(--line)}
.legend button:last-child{border-bottom:0}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.chart-box{position:relative;height:220px}

/* lists */
.list{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item:active{background:var(--surface2)}
.ic{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-size:17px;flex:none;background:var(--surface2)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:#fff;background-size:cover;background-position:center}
.av.lg{width:56px;height:56px;font-size:20px}
.item .t{font-weight:600;font-size:14px}
.item .s{font-size:12.5px;color:var(--muted)}
.amt{font-weight:600;text-align:right;white-space:nowrap}
.amt .s{font-weight:500}
.empty{padding:32px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty .e{font-size:24px;margin-bottom:10px;opacity:.45;display:flex;justify-content:center;color:var(--ink2)}
.empty .e:empty{display:none}
.day{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;margin:18px 4px 7px}
.mini-btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.mini-btn:hover{border-color:var(--ink2);background:var(--surface2)}
.mini-btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.insight{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.insight:last-child{border-bottom:0}
.alert{border-radius:14px;padding:11px 14px;font-size:13.5px;font-weight:600;margin-top:12px;display:flex;gap:8px;align-items:flex-start}
.alert.warn{background:var(--warn-bg);color:var(--warn)} .alert.neg{background:var(--neg-bg);color:var(--neg)} .alert.info{background:var(--info-bg);color:var(--brand-text)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--muted);padding:6px 0;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink);font-weight:600}
.fab{justify-self:center;width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:24px;font-weight:300;cursor:pointer;margin-top:-18px;display:grid;place-items:center}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;animation:up .2s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:88vh}}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:18px 20px 12px}
.sheet-h h3{margin:0;font-size:17px;font-weight:700;flex:1;letter-spacing:-.01em}
.x{border:0;background:var(--surface2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:15px}
.x:hover{background:var(--line)}
.sheet-b{overflow-y:auto;padding:4px 20px 20px;-webkit-overflow-scrolling:touch}
.sheet-f{padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;background:var(--bg);border-radius:0 0 16px 16px}

/* forms */
.f{margin-top:12px}
.f > label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:0 0 6px}
.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;outline:none;font-size:15px;min-width:0;transition:border-color .15s}
.in:focus{border-color:var(--ink);box-shadow:none}
textarea.in{min-height:70px;resize:vertical}
.amount-in{font-size:32px;font-weight:700;letter-spacing:-.02em;text-align:center;padding:14px;border-radius:var(--radius)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--surface2);border-radius:8px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:6px;padding:8px 6px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn{border:0;border-radius:8px;padding:12px 16px;font-weight:600;font-size:15px;cursor:pointer;background:var(--surface2);color:var(--ink)}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--ink);color:var(--bg);flex:1}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--neg)}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.err-box{background:var(--neg-bg);color:var(--neg);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:12px}
.err-hint{font-weight:500;font-size:12px;opacity:.85;margin-top:4px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.ok-text{color:var(--pos)} .bad-text{color:var(--neg)}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:7px;cursor:pointer;font-weight:600;font-size:13.5px}
.pchip .av{width:24px;height:24px;font-size:10px}
.pchip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.split-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.split-row:last-child{border-bottom:0}
.split-row .in{width:96px;padding:8px 10px;text-align:right}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked + span{background:var(--pos)}
.switch input:checked + span:before{transform:translateX(18px)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types-primary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.types-primary .type{text-align:center;padding:18px 8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.types-primary .type b{font-size:13.5px;line-height:1.25;hyphens:none}
.types-primary .type .ic{margin-bottom:6px;width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.types-secondary{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.types-secondary .type{padding:12px 14px}
.types-secondary .type b{font-size:13px}
.types-secondary .type span{font-size:12px}
.type-more-btn{border:0;background:none;color:var(--ink2);font-weight:600;font-size:14px;cursor:pointer;padding:13px 0;min-height:46px;width:100%;text-align:center}
.type-more-btn:hover{color:var(--ink)}
.extra-toggle{border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;padding:14px 0 8px;min-height:46px;width:100%;text-align:center;display:block}
.extra-toggle:hover{color:var(--fg)}
.filter-toggle{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--fg)}
.filter-toggle .badge{background:var(--brand);color:#000;font-size:11px;font-weight:700;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.type{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:16px;text-align:left;cursor:pointer}
.type .ic{margin-bottom:10px}
.type b{display:block;font-size:15px}
.type span{font-size:12.5px;color:var(--muted)}
.type.wide{grid-column:span 2}
.types .type[data-type=repayment],.types .type[data-type=goal]{grid-column:auto}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-weight:600;word-break:break-word}

/* toast — H9 clear feedback */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:13.5px;box-shadow:0 4px 16px rgba(0,0,0,.15);max-width:calc(100vw - 32px);display:flex;gap:10px;align-items:center}
#toast{pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast.err{background:var(--neg);color:#fff}
#toast button{border:0;background:rgba(255,255,255,.2);color:inherit;border-radius:6px;padding:4px 9px;font-weight:600;cursor:pointer}

/* loading */
.skel{background:linear-gradient(90deg,var(--surface) 0%,var(--surface2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:16px}
@keyframes sh{to{background-position:-200% 0}}
.boot{padding:40px 16px;text-align:center}
.search{position:relative}
.search .in{padding-left:38px}
.search:before{content:"";position:absolute;left:14px;top:13px;width:16px;height:16px;background:currentColor;-webkit-mask:var(--search-mask) center/contain no-repeat;mask:var(--search-mask) center/contain no-repeat;font-size:0;color:var(--muted)}
.filters{display:flex;gap:8px;margin-top:10px}
.filters select{flex:1;min-width:0;padding:8px 10px;font-size:13px}

/* dashboard / friend grids (single column on phones) */
.dash{display:grid;grid-template-columns:minmax(0,1fr);gap:0 20px;margin-top:8px}
.blk{min-width:0}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 20px}
.fcol{min-width:0}
.side{display:none}
.kbd-hint{display:none}
@media (hover:hover){
  .item:hover{background:var(--surface2)}
  .stat:hover,.type:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(20,22,27,.06),0 10px 28px rgba(20,22,27,.09)}
  .stat,.type{transition:transform .15s,box-shadow .15s}
  .chip:hover,.mini-btn:hover{border-color:var(--ink2)}
  .legend button:hover{background:var(--surface2)}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ── Laptop / desktop ── */
/* Laptop layout: html.lap is set automatically (wide screen) or forced via the layout button */
html.lap body{font-size:15px}
html.lap .tabbar{display:none}
html.lap .side{display:flex;flex-direction:column;gap:4px;position:fixed;top:0;bottom:0;left:0;width:236px;padding:22px 14px;background:var(--surface);border-right:1px solid var(--line);z-index:25}
html.lap .side .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em;padding:0 8px 18px}
html.lap .side .logo{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:16px;letter-spacing:.02em}
html.lap .side .add{border:0;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-weight:800;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
html.lap .side .add kbd{font:inherit;font-size:11px;opacity:.7;border:1px solid currentColor;border-radius:5px;padding:0 5px}

/* ── Theme: quiet surfaces, yellow reserved for actions ── */
body{background:var(--bg)}
.topbar{background:color-mix(in srgb,var(--bg) 88%,transparent);color:var(--ink);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding-bottom:10px;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}
.topbar h1{font-family:var(--display);letter-spacing:-.02em;color:var(--ink);font-size:19px}
.topbar .sync{color:var(--muted)}
.topbar .sync .dot{background:var(--pos)} .topbar .sync .dot.busy{background:var(--brand-strong)} .topbar .sync .dot.err{background:var(--neg)}
.topbar .back,.topbar .lay-btn{background:var(--surface2);border-color:transparent;color:var(--ink2);box-shadow:none}
.section h2,.hero .big,.stat .v,.sheet-h h3,.side .brand,.amount-in{font-family:var(--display)}
/* Sentence case reads more calmly than tracked-out capitals. */
.section h2{text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;color:var(--ink2)}
/* The balance is the reason you open the app, so it gets the one dark surface on the screen. */
.hero{background:var(--ink);color:var(--bg);box-shadow:none;position:relative;overflow:hidden}
.hero .label{opacity:.65;color:inherit;text-transform:none;letter-spacing:0;font-size:13px;font-weight:500}
.hero .big{font-size:34px}
.hero .pill{background:rgba(255,255,255,.12);color:inherit}
/* At night the hero must not invert to near-white — keep it a raised dark surface. */
@media (prefers-color-scheme: dark){
  .hero{background:#232220;color:var(--ink);border:1px solid var(--line)}
}
.card,.list,.stat,.type{border:1px solid var(--line);box-shadow:none}
.list{box-shadow:none}
.item{padding:12px 14px}
.ic{background:var(--surface2);border-radius:var(--radius-sm)}
.stat{position:relative;overflow:hidden}
.stat .si{width:32px;height:32px;border-radius:var(--radius-sm);display:inline-grid;place-items:center;font-size:15px;background:var(--tone-bg,var(--surface2));letter-spacing:0}
[data-tone=violet]{--tone:#6B5BB5;--tone-bg:#F0EEF8}
[data-tone=mint]{--tone:#3E8F6E;--tone-bg:#EBF4EF}
[data-tone=coral]{--tone:#C4706B;--tone-bg:#F9EEED}
[data-tone=sky]{--tone:#4A82B8;--tone-bg:#EDF2F8}
[data-tone=pink]{--tone:#BE6D8C;--tone-bg:#F8EFF3}
[data-tone=sun]{--tone:#B8912F;--tone-bg:#F8F2E2}
@media (prefers-color-scheme: dark){
  [data-tone=violet]{--tone-bg:#2A2738} [data-tone=mint]{--tone-bg:#1E2E27} [data-tone=coral]{--tone-bg:#322422}
  [data-tone=sky]{--tone-bg:#1F2833} [data-tone=pink]{--tone-bg:#2F2429} [data-tone=sun]{--tone-bg:#302A1C}
}
.type[data-tone] .ic{background:var(--tone-bg)}
.chip{border-color:var(--line);background:var(--surface)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.fab{background:var(--brand);color:var(--brand-ink);box-shadow:0 2px 8px rgba(35,34,32,.14);font-weight:700}
.btn.primary{background:var(--brand);color:var(--brand-ink);box-shadow:none;font-weight:700}
.btn.primary:hover{background:var(--brand-strong)}
.mini-btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.tabbar{background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tab{position:relative;color:var(--muted);font-size:11px}
.tab svg{stroke-width:1.8}
.tab.on{color:var(--ink);font-weight:700}
.tab.on svg{fill:none;stroke:var(--ink);stroke-width:2.2}
.tab.on::after{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:2px;background:var(--brand)}
.bar > i{background:var(--brand)}
.bar > i.hi{background:#FF9F1C}
.bar > i.over{background:var(--neg)}
.seg button.on{color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}

.switch input:checked + span{background:var(--pos)}
.in:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,214,0,.2)}

.tag.calc{background:#E8F1FF;color:#1B5FC1}

.hero-link{margin-top:10px;border:0;background:rgba(255,255,255,.15);color:#fff;font:inherit;font-weight:600;border-radius:8px;padding:9px 14px;cursor:pointer}

.big-note{text-align:center;padding:6px 4px 2px}
.big-note .e{font-size:40px;display:flex;justify-content:center;color:var(--ink2);margin-bottom:4px}
.big-note h4{font-family:var(--display);font-size:20px;margin:6px 0}
html.lap .goals{grid-template-columns:repeat(3,minmax(0,1fr))}
html.lap .owe{grid-template-columns:1fr 1fr}
/* bottom bar */
.tabbar{padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tab{font-size:11px;gap:3px;padding:4px 0 2px}
.tab svg{width:22px;height:22px}
.fab{width:48px;height:48px;font-size:24px;margin-top:-20px;border-radius:50%}
.tab.on::after{top:-1px}
#app{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
#toast{bottom:calc(70px + env(safe-area-inset-bottom))}
/* ── Accounts ── */
.topbar{flex-wrap:wrap}
.acc-btn{flex-basis:100%;order:10;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px;margin-top:8px;font:inherit;cursor:pointer;text-align:left;box-shadow:none;min-width:0}
.acc-btn b{display:block;font-size:13.5px;line-height:1.2}
.acc-bal{font-size:12px;color:var(--muted)}
.acc-btn .chev{font-size:13px;color:var(--muted)}
/* Account marks: the bank's colour as a soft tint with the glyph stroked in it, rather than a
   saturated block. Four of these sit side by side, so they have to stay quiet. */
.acc-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--acc-c,var(--ink)) 13%,transparent)!important;color:var(--acc-c,var(--ink))}

.acc-ic .ico{width:18px;height:18px}

.ico{flex:none;vertical-align:middle}
:root{--search-mask:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'%3E%3Ccircle cx='11' cy='11' r='7'/%3E%3Cpath d='m20 20-3.5-3.5'/%3E%3C/svg%3E")}
.hc{display:inline-flex;align-items:center;gap:7px}
.hc.ok{color:var(--pos)} .hc.bad{color:var(--neg)}

.mini-btn.icon-btn:hover{color:var(--ink)}
/* The amount is the point of the row, so it gets its own slot instead of being truncated

.due-row{flex-wrap:wrap;align-items:center}
.due-row .grow{min-width:0;flex:1 1 auto}
.due-amt{font-weight:700;font-size:15px;white-space:nowrap;margin-left:8px}
.due-actions{flex:none;gap:4px!important}
@media (max-width:560px){

}
.snav-i{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;color:inherit;opacity:.85}
.snav.on .snav-i{opacity:1}
/* Icon slots hold a stroked glyph, so they tint the icon rather than sit behind an emoji. */
.ic > .ico{color:var(--ink2)}
.stat .si{color:var(--tone,var(--ink2))}
.quick button span{color:var(--tone,var(--ink2))}
.type .ic > .ico{color:var(--tone,var(--ink2))}
.item .ic > .ico{color:var(--ink2)}
.acc-opt.on{background:var(--surface2)}
.wallets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.wallet{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;text-align:left;font:inherit;color:inherit;cursor:pointer;box-shadow:none;position:relative;overflow:hidden;min-width:0}
.wallet::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
.wallet .row{gap:8px}
/* min-height keeps all four cards level whether the bank name runs to one line or two */
.w-name{font-weight:600;font-size:13px;line-height:1.3;min-height:2.6em;white-space:normal!important;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.w-sub{font-size:11px;color:var(--muted)}
.w-bal{font-family:var(--display);font-size:20px;font-weight:700;margin-top:6px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-flow{display:flex;gap:8px;font-size:11px;font-weight:600;margin-top:2px;flex-wrap:wrap}
.wallet .chev{color:var(--muted);font-size:16px}
/* Account heroes keep their bank colour, muted toward the ink so they sit quietly beside each other. */
.acc-hero{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 80%,#2A2824) 0%,color-mix(in srgb,var(--acc) 52%,#201F1C) 100%)!important;color:#fff!important;box-shadow:none!important}
.acc-hero .label{opacity:.8}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px;background:rgba(255,255,255,.1);border-radius:8px;padding:8px}
.hero:not(.acc-hero) .trio{background:rgba(255,255,255,.07)}
.trio span{display:block;font-size:11px;font-weight:500;text-transform:none;letter-spacing:0;opacity:.7}
.trio b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.big-trio b{font-size:17px}
.budget-mini{margin-top:10px}
.amt.xfer{color:#1B6FD8}
.acc-edit{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.acc-edit:last-of-type{border-bottom:0}
.acc-edit .in{padding:9px 10px}
.acc-edit input[data-accopen]{width:110px;text-align:right}
.act-sum{display:flex;gap:12px;font-size:12.5px;font-weight:600;margin:10px 4px 0;color:var(--muted)}
.act-sum span:first-child{flex:1}
html.lap .wallets{grid-template-columns:repeat(4,minmax(0,1fr))}
html.lap .acc-btn{flex-basis:auto;order:0;margin:0 0 0 auto;max-width:340px}
html.lap .topbar{flex-wrap:nowrap}
/* layout switcher */
.lay-btn{border:1px solid var(--line);background:transparent;border-radius:6px;height:32px;padding:0 8px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}
.lay-btn:hover{background:var(--surface2)}

.lay-opt b{display:block}
.lay-opt span.d{font-size:12px;color:var(--muted)}
.lay-opt .ic{font-size:22px}
</style>

'use strict';
/* ════════════════════════ State ════════════════════════ */
const S = {

  period: 'this_month', custom: { from: '', to: '' },
  act: { q: '', type: '', friend: '', cat: '', range: 'all' },

  acc: (() => { try { return localStorage.getItem('hisaab.acc') || 'all'; } catch (e) { return 'all'; } })()
};
let D = null;           // derived data
const charts = {};

/* ════════════════════════ Utilities ════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const sum = (a, f = x => x) => r2(a.reduce((s, x) => s + (Number(f(x)) || 0), 0));
const pad = n => String(n).padStart(2, '0');
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2));

  if (push && (S.view !== view || JSON.stringify(S.params) !== JSON.stringify(params))) S.stack.push({ view: S.view, params: S.params });
  S.view = view; S.params = params;
  const wide = document.documentElement.classList.contains('lap');
  if (['home', 'activity', 'friends', 'more'].includes(view) || (wide && ['reports', 'budgets', 'reminders', 'categories', 'settings'].includes(view))) S.stack = [];
  render(); window.scrollTo(0, 0);
}
function render() {
  if (!S.d) return;
  Object.values(charts).forEach(c => c.destroy()); for (const k in charts) delete charts[k];
  const v = S.view;
  $('#title').textContent = v === 'friend' && D.friendMap[S.params.id] ? D.friendMap[S.params.id].name : TITLES[v];
  $('#backBtn').hidden = !S.stack.length;
  updateAccBtn();
  const tabView = { friend: 'friends', reports: 'more', goals: 'home', budgets: 'more', categories: 'more', settings: 'more', reminders: 'more' }[v] || v;
  $$('.tab').forEach(b => b.classList.toggle('on', b.dataset.view === tabView));
  const sideView = v === 'friend' ? 'friends' : v;
  const SNAV_ICON = { home: 'home', activity: 'list', friends: 'users', reports: 'chart', budgets: 'target', reminders: 'bell', categories: 'tag', settings: 'settings' };
  $$('.snav').forEach(b => {
    b.classList.toggle('on', b.dataset.view === sideView);
    const slot = $('.snav-i', b);
    if (slot && !slot.firstChild) slot.innerHTML = ic(SNAV_ICON[b.dataset.view] || 'list', 18);
  });
  const fn = { home: viewHome, reports: viewReports, goals: viewGoals, activity: viewActivity, friends: viewFriends, friend: viewFriend, more: viewMore, budgets: viewBudgets, categories: viewCategories, settings: viewSettings, reminders: viewReminders }[v];
  $('#view').innerHTML = fn();
  if (v === 'reports') mountHomeCharts();
  if (v === 'home') maybeDuePopup();
}

/* ── Home: simple, friendly ── */
function ownerName() { return (S.d && S.d.settings.ownerName) || 'Swati'; }
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }
function goalsWithProgress() {
  return (S.d.goals || []).map(g => {
    const saved = sum(S.d.transactions.filter(t => t.goalId === g.id), t => t.amount);
    return Object.assign({}, g, { saved, pct: g.target > 0 ? Math.min(100, saved / g.target * 100) : 0, left: r2(Math.max(0, g.target - saved)) });
  });
}
function goalCard(g) {
  return `<div class="goal" data-act="goal" data-id="${g.id}"><div class="row"><span class="gemo">${esc(g.emoji || '🎯')}</span><div class="grow"><div class="t ellipsis">${esc(g.name)}</div>
    <div class="s">${money(g.saved)} of ${money(g.target)}${g.saved >= g.target ? ' · 🎉 Done!' : ''}</div></div>
    <button class="mini-btn primary" data-act="addToGoal" data-id="${g.id}">+ Add</button></div>
    <div class="bar" style="margin-top:10px"><i style="width:${g.pct}%;background:${g.saved >= g.target ? 'var(--pos)' : 'var(--brand)'}"></i></div>
    <div class="tiny muted" style="margin-top:4px">${g.saved >= g.target ? 'You reached it! Tap to mark it done.' : money(g.left) + ' more to go'}</div></div>`;
}
function viewHome() { return selAcc() === 'all' ? viewOverview() : viewAccountHome(selAcc()); }
function recentFor(accId, n) {
  return S.d.transactions.filter(t => accId === 'all' || acctOf(t) === accId || t.toAccountId === accId)
    .sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (a.createdAt < b.createdAt ? 1 : -1)).slice(0, n);
}
function oweCards() {
  const T = D.totals;
  return `<div class="owe">
    <button class="stat" data-tone="mint" data-act="nav" data-view="friends"><div class="k"><span class="si">${ic('arrowDown', 17)}</span>Friends owe you</div><div class="v num pos">${money(T.receivable)}</div>${T.overdueRecv > 0 ? `<div class="s neg">${money(T.overdueRecv)} is late</div>` : '<div class="s">to collect</div>'}</button>
    <button class="stat" data-tone="coral" data-act="nav" data-view="friends"><div class="k"><span class="si">${ic('arrowUp', 17)}</span>You owe friends</div><div class="v num ${T.payable > 0 ? 'neg' : ''}">${money(T.payable)}</div><div class="s">to pay back</div></button>
  </div>`;
}
function quickRow(items, accId) {
  return `<div class="quick">${items.map(([k, i, l, pre]) => `<button data-act="quickAdd" data-type="${k}" data-acc="${accId || ''}" data-pre='${esc(JSON.stringify(pre || {}))}' data-tone="${TONES[k] || 'violet'}"><span>${ic(i, 19)}</span>${esc(l)}</button>`).join('')}</div>`;
}
function viewOverview() {
  const t = todayStr(), m = accSummary('all', monthStart(t), monthEnd(t)), tot = accSummary('all');
  const due = upcomingItems().filter(x => x.overdue || x.date <= addDays(t, 7));

  // The greeting, the per-account in/out pairs and the quick-action row were cut — the greeting
  // says nothing, the extra figures live on each account's own page, and the + button already
  // offers the same four actions.
  return `
  <div class="hero">
    <div class="label">Total across your ${D.accounts.length} accounts</div>
    <div class="big num ${tot.balance < 0 ? 'neg' : ''}">${money(tot.balance)}</div>

  </div>

      <div class="row"><span class="acc-ic" style="--acc-c:${a.color}">${accIcon(a)}</span><div class="grow"><div class="w-name ellipsis">${esc(a.name)}</div></div><span class="chev">›</span></div>
      <div class="w-bal num ${s.balance < 0 ? 'neg' : ''}">${money(s.balance)}</div></button>`; }).join('')}</div>
  ${oweCards()}
  ${due.length ? `<div class="section"><h2>Money to collect</h2><button class="link" data-act="nav" data-view="reminders">See all</button></div>${upcoming(4)}` : ''}
  <div class="section"><h2>Recent</h2><button class="link" data-act="nav" data-view="activity">See all</button></div>
  <div class="list">${recentFor('all', 5).map(x => txnRow(x)).join('') || `<div class="empty"><div class="e"></div>Nothing yet. Tap <b>+</b> to add your first entry.</div>`}</div>
  <button class="link" style="display:block;margin:16px auto 0" data-act="nav" data-view="reports">See reports and charts</button>

}
function groupRows(rows, keyFn, valFn) { const m = {}; rows.forEach(r => { const k = keyFn(r) || '—'; m[k] = r2((m[k] || 0) + valFn(r)); }); return Object.entries(m).sort((a, b) => b[1] - a[1]); }
function barList(entries, color, empty, labelFn) {
  if (!entries.length) return `<div class="empty">${empty}</div>`;
  const max = Math.max(...entries.map(e => e[1]), 1);
  return entries.slice(0, 6).map(([k, v]) => `<div class="brow"><div class="top"><span class="ellipsis">${labelFn ? labelFn(k) : esc(k)}</span><b class="num">${money(v)}</b></div><div class="bar"><i style="width:${Math.max(3, v / max * 100)}%;background:${color}"></i></div></div>`).join('');
}
function viewAccountHome(id) {
  const a = accById(id), P = PURPOSE[a.purpose], t = todayStr(), from = monthStart(t), to = monthEnd(t);
  const all = accSummary(id), m = accSummary(id, from, to);
  const monthFlows = D.flows.filter(f => f.acc === id && inRange(f.date, from, to));
  let focus = '';
  if (a.purpose === 'business') {
    const clients = groupRows(monthFlows.filter(f => f.kind === 'income'), f => f.t.payee || f.t.source, f => f.amt);
    const spend = groupRows(monthFlows.filter(f => f.kind === 'expense'), f => (D.catMap[f.t.category] || {}).name || 'Other', f => -f.amt);
    focus = `<div class="section"><h2>Client payments · ${monthLabel(t.slice(0, 7), true)}</h2></div><div class="card">${barList(clients, 'var(--pos)', 'No client payments this month yet.')}</div>
      <div class="section"><h2>Business spending · ${monthLabel(t.slice(0, 7), true)}</h2></div><div class="card">${barList(spend, 'var(--neg)', 'No business spending this month.')}</div>`;
  } else if (a.purpose === 'guards') {
    const guards = groupRows(monthFlows.filter(f => f.kind === 'expense'), f => f.t.payee || (D.catMap[f.t.category] || {}).name, f => -f.amt);
    focus = `<div class="section"><h2>Paid to guards · ${monthLabel(t.slice(0, 7), true)}</h2></div><div class="card">${barList(guards, '#FF8A00', 'No guard payments this month yet.')}</div>`;
  } else {
    const spend = groupRows(consIn(from, to, id), c => c.cat, c => c.mine);
    focus = `<div class="section"><h2>Where money went · ${monthLabel(t.slice(0, 7), true)}</h2></div><div class="card">${barList(spend, 'var(--brand)', 'No spending this month yet.', k => { const c = D.catMap[k]; return c ? c.icon + ' ' + esc(c.name) : 'Other'; })}</div>`;
  }
  let budget = '';
  if (id === DEFAULT_ACC) {
    const B = D.budgets.overall, spent = sum(consIn(from, to, id), c => c.mine);
    budget = B > 0 ? `<div class="card budget-mini"><div class="row small"><span class="grow">Monthly budget (optional)</span><b class="num">${money(spent)} / ${money(B)}</b></div>
      <div class="bar" style="margin-top:8px"><i class="${spent > B ? 'over' : pct(spent, B) >= 70 ? 'hi' : ''}" style="width:${Math.min(100, pct(spent, B))}%"></i></div>
      <div class="tiny muted" style="margin-top:4px">${B - spent >= 0 ? money(B - spent) + ' left this month' : money(spent - B) + ' over budget'}</div></div>`
      : `<button class="link small" data-act="nav" data-view="budgets" style="margin-top:10px">+ Set an optional monthly budget</button>`;
  }
  return `
  <div class="hero acc-hero" style="--acc:${a.color}">
    <div class="row"><span class="acc-ic lg" style="--acc-c:#fff;background:rgba(255,255,255,.16)!important">${accIcon(a)}</span><div class="grow"><div class="label">${esc(a.name)}</div><div class="small" style="opacity:.75">${esc(P.label)}</div></div></div>
    <div class="label" style="margin-top:12px">Balance now</div>
    <div class="big num">${money(all.balance)}</div>
    <div class="trio"><div><span>Opening</span><b class="num">${money(all.opening)}</b></div><div><span>Money in</span><b class="num">+${money(all.credits)}</b></div><div><span>Money out</span><b class="num">−${money(all.debits)}</b></div></div>
  </div>
  ${budget}
  ${quickRow(P.quick, id)}
  <div class="owe">
    <div class="stat" data-tone="mint"><div class="k"><span class="si">${ic('arrowDown', 17)}</span>In this month</div><div class="v num pos">+${money(m.credits)}</div></div>
    <div class="stat" data-tone="coral"><div class="k"><span class="si">${ic('arrowUp', 17)}</span>Out this month</div><div class="v num neg">−${money(m.debits)}</div></div>
  </div>
  ${focus}
  ${P.friends && id === DEFAULT_ACC ? `<div class="section"><h2>Friends</h2></div>${oweCards()}` : ''}
  <div class="section"><h2>Recent in ${esc(a.short || a.name)}</h2><button class="link" data-act="nav" data-view="activity">See all</button></div>
  <div class="list">${recentFor(id, 6).map(x => txnRow(x)).join('') || `<div class="empty"><div class="e"></div>No entries in this account yet.</div>`}</div>
  <button class="btn block" style="margin-top:16px" data-act="nav" data-view="reports">${esc(a.short || a.name)} reports</button>
  <div style="height:8px"></div>`;

function viewGoals() {
  const all = goalsWithProgress(), active = all.filter(g => g.status === 'active'), done = all.filter(g => g.status === 'done');
  return `<div class="small muted" style="margin-bottom:12px">Save for things you want. Money you add to a goal counts as spending, so move it to your savings account. You can have up to 3 goals at a time.</div>
  ${active.length ? `<div class="goals">${active.map(goalCard).join('')}</div>` : ''}
  ${active.length < 3 ? `<button class="btn primary block" style="margin-top:12px" data-act="newGoal">+ New goal</button>` : `<div class="hint" style="text-align:center">You have 3 goals. Finish or remove one to add another.</div>`}
  ${done.length ? `<div class="section"><h2>Finished</h2></div><div class="list">${done.map(g => `<div class="item" data-act="goal" data-id="${g.id}"><div class="gemo">${esc(g.emoji || '🎯')}</div><div class="grow"><div class="t">${esc(g.name)}</div><div class="s">Saved ${money(g.saved)}</div></div><span class="tag actual">Done</span></div>`).join('')}</div>` : ''}`;
}
const GOAL_EMOJIS = ['📱', '💻', '✈️', '🎁', '👗', '👟', '🏍️', '🏠', '💍', '🎓', '🐶', '🎯'];
function openGoalForm(g) {
  g = g || {}; const ctx = {};
  if (!g.id && goalsWithProgress().filter(x => x.status === 'active').length >= 3) return toast('You can have 3 goals at a time. Finish or remove one first.', true);
  let emoji = g.emoji || '🎯';
  const w = openSheet(g.id ? 'Edit goal' : 'New goal', `
    <div class="f" style="margin-top:0"><label>What are you saving for?</label><input class="in" id="gName" value="${esc(g.name || '')}" placeholder="e.g. New phone"></div>
    <div class="f"><label>How much does it cost?</label><input class="in num" id="gTarget" type="number" inputmode="decimal" value="${g.target || ''}" placeholder="e.g. 30000"></div>
    <div class="f"><label>Pick an icon</label><div class="emojis">${GOAL_EMOJIS.map(e => `<button type="button" data-e="${e}" class="${e === emoji ? 'on' : ''}">${e}</button>`).join('')}</div></div><div id="gErr"></div>`,
    { footer: `<button class="btn primary" data-save>${g.id ? 'Save' : 'Create goal'}</button>` });
  ctx.errEl = $('#gErr', w);
  $$('[data-e]', w).forEach(b => b.onclick = () => { emoji = b.dataset.e; $$('[data-e]', w).forEach(x => x.classList.toggle('on', x === b)); });
  setTimeout(() => $('#gName', w).focus(), 150);
  $('[data-save]', w).onclick = async e => {
    const name = $('#gName', w).value.trim(), target = Number($('#gTarget', w).value);
    if (!name) return showErr(ctx, 'Give your goal a name.');
    if (!(target > 0)) return showErr(ctx, 'Enter how much it costs.');
    try { const d = await save(e.target, 'saveGoal', { id: g.id, name, target, emoji }, ctx, g.id ? 'Goal saved ✓' : 'Goal created 🎯'); closeSheet(w); if (!g.id && w._then) w._then(d.id); } catch (err) { }
  };
  return w;
}
function openContribute(goalId, existingTxn) {
  const goals = goalsWithProgress().filter(g => g.status === 'active' || (existingTxn && g.id === existingTxn.goalId));
  if (!goals.length) { const w = openGoalForm(); if (w) w._then = id => openContribute(id); return; }
  const t = existingTxn || {}; const ctx = {};
  let gid = goalId || t.goalId || goals[0].id;
  const w = openSheet(t.id ? 'Edit goal money' : 'Add money to a goal', `
    <div class="f" style="margin-top:0"><label>Which goal?</label><div class="list">${goals.map(g => `<button type="button" class="item" data-g="${g.id}"><div class="gemo">${esc(g.emoji)}</div><div class="grow"><div class="t">${esc(g.name)}</div><div class="s">${money(g.saved)} of ${money(g.target)}</div></div><span class="pick">${g.id === gid ? '✅' : ''}</span></button>`).join('')}</div>
      ${goals.filter(g => g.status === 'active').length < 3 && !t.id ? '<button type="button" class="link" data-newgoal style="border:0;background:none;color:var(--brand-text);font-weight:700;margin-top:8px;cursor:pointer">+ New goal</button>' : ''}</div>
    <div class="f"><label>How much are you adding?</label><input class="in amount-in num" id="cAmt" type="number" inputmode="decimal" value="${t.amount || ''}" placeholder="₹0"></div>
    <div class="f"><label>Date</label><input class="in" type="date" id="cDate" value="${t.date || todayStr()}"></div>
    <div class="hint">This counts as spending this month. After saving, move this money to your goal savings account.</div><div id="cErr"></div>`,
    { footer: `${t.id ? '<button class="btn danger" data-del>Delete</button>' : ''}<button class="btn primary" data-save>${t.id ? 'Save' : 'Add money'}</button>` });
  ctx.errEl = $('#cErr', w);
  $$('[data-g]', w).forEach(b => b.onclick = () => { gid = b.dataset.g; $$('[data-g] .pick', w).forEach(x => x.textContent = ''); $('.pick', b).textContent = '✅'; });
  const ng = $('[data-newgoal]', w); if (ng) ng.onclick = () => { closeSheet(w); const f = openGoalForm(); if (f) f._then = id => openContribute(id); };
  setTimeout(() => { if (!t.id) $('#cAmt', w).focus(); }, 150);
  $('[data-save]', w).onclick = async e => {
    const amount = Number($('#cAmt', w).value), date = $('#cDate', w).value, g = goals.find(x => x.id === gid);
    if (!(amount > 0)) return showErr(ctx, 'Enter an amount.');
    if (!date) return showErr(ctx, 'Choose a date.');
    const gc = D.topCats.find(c => c.name === 'Goals');
    try {
      await save(e.target, 'saveTransaction', { id: t.id, type: 'expense', goalId: gid, amount, date, category: gc ? gc.id : '', description: 'Saved for ' + g.name, notes: t.notes || '' }, ctx, 'Added to ' + g.name + ' ✓');
      closeSheet(w);
      if (!t.id) showMovePrompt(amount, g);
    } catch (err) { }
  };
  const del = $('[data-del]', w);
  if (del) del.onclick = async () => { if (await confirmSheet('Delete this goal money?', 'It will be taken off the goal and off your spending.', 'Delete', true)) { await save(del, 'deleteTransaction', { id: t.id }, {}, 'Deleted ✓'); closeSheet(w); } };
}
function showMovePrompt(amount, g) {
  const after = goalsWithProgress().find(x => x.id === g.id) || g;
  const reached = after.saved >= after.target;
  const w = openSheet('', `<div class="big-note"><div class="e">${reached ? '🎉' : '🏦'}</div>
    <h4>${reached ? 'You reached your goal!' : 'Now move the money'}</h4>
    <p>Move <b>${money(amount)}</b> from your main account to your <b>goal savings account</b>${reached ? '' : ' so you don\'t spend it by mistake'}.</p>
    ${reached ? `<p class="small muted">${esc(g.emoji)} ${esc(g.name)} has ${money(after.saved)} of ${money(after.target)}. Go get it! 🛍️</p>` : `<p class="small muted">${esc(g.emoji)} ${esc(g.name)}: ${money(after.saved)} of ${money(after.target)} saved</p>`}</div>`,
    { footer: `<button class="btn" data-later>Remind me tomorrow</button><button class="btn primary" data-done>Done, I moved it ✓</button>` });
  $('[data-done]', w).onclick = () => { closeSheet(w); toast('Great! 💪'); if (reached) openGoalDetail(g.id); };
  $('[data-later]', w).onclick = () => { closeSheet(w); save(null, 'saveReminder', { title: 'Move ' + money(amount) + ' to savings for ' + g.name, dueDate: addDays(todayStr(), 1), frequency: 'once' }, {}, 'OK, we\'ll remind you tomorrow 🔔'); };
}
function openGoalDetail(id) {
  const g = goalsWithProgress().find(x => x.id === id); if (!g) return;
  const list = S.d.transactions.filter(t => t.goalId === id).sort((a, b) => a.date < b.date ? 1 : -1);
  const w = openSheet(g.emoji + ' ' + g.name, `<div class="card"><div style="font-family:var(--display);font-size:28px;font-weight:800" class="num">${money(g.saved)} <span class="muted" style="font-size:16px">of ${money(g.target)}</span></div>
    <div class="bar" style="margin-top:10px;height:12px"><i style="width:${g.pct}%;background:${g.saved >= g.target ? 'var(--pos)' : 'var(--brand)'}"></i></div>
    <div class="small muted" style="margin-top:6px">${g.status === 'done' ? 'Finished ✅' : g.saved >= g.target ? '🎉 You have enough! Mark it done when you buy it.' : money(g.left) + ' more to go'}</div></div>
    <div class="section"><h2>Money added</h2></div>
    <div class="list">${list.map(t => `<button class="item" data-act="txn" data-id="${t.id}"><div class="ic">${ic('target')}</div><div class="grow"><div class="t">${fmtDate(t.date)}</div><div class="s">${t._pending ? 'Saving…' : 'Added'}</div></div><div class="amt num">${money(t.amount)}</div></button>`).join('') || '<div class="empty">No money added yet.</div>'}</div>`,
    { footer: g.status === 'active' ? `<button class="btn" data-edit>Edit</button><button class="btn" data-done>${g.saved >= g.target ? '✅ I bought it' : 'Mark done'}</button><button class="btn primary" data-add>+ Add</button>` : `<button class="btn danger" data-remove>Remove</button>` });
  const q = sel => $(sel, w);
  if (q('[data-edit]')) q('[data-edit]').onclick = () => { closeSheet(w); openGoalForm(g); };
  if (q('[data-add]')) q('[data-add]').onclick = () => { closeSheet(w); openContribute(g.id); };
  if (q('[data-done]')) q('[data-done]').onclick = async () => { if (await confirmSheet('Mark "' + g.name + '" as done?', 'It moves to Finished, and frees a goal slot. The money stays in your history.', 'Mark done')) { save(null, 'setGoalStatus', { id: g.id, status: 'done' }, {}, '🎉 Goal finished!'); closeSheet(w); } };
  if (q('[data-remove]')) q('[data-remove]').onclick = async () => { if (await confirmSheet('Remove this goal?', 'The goal disappears. Money you added stays in your history.', 'Remove', true)) { save(null, 'setGoalStatus', { id: g.id, status: 'deleted' }, {}, 'Goal removed'); closeSheet(w); } };
}

/* ── Pop-up: money to collect today ── */
function maybeDuePopup() {
  if (sheetStack.length || !S.d) return;
  const t = todayStr();
  const items = S.d.ledger.filter(i => i.outstanding > 0.004 && i.dueDate && i.dueDate <= t);
  if (!items.length) return;
  // Once a day; show again the same day only if more payments became due since it was dismissed.
  let seenCount = -1;
  try { const v = JSON.parse(localStorage.getItem('hisaab.popup') || 'null'); if (v && v.day === t) seenCount = v.count; } catch (e) { }
  if (seenCount >= items.length) return;
  const recv = items.filter(i => i.direction === 'receivable'), pay = items.filter(i => i.direction === 'payable');
  const row = i => `<div class="item" style="cursor:default">${avatar(D.friendMap[i.friendId])}<div class="grow"><div class="t ellipsis">${esc(friendName(i.friendId))} ${i.direction === 'receivable' ? 'owes you' : '— you owe'} <b class="num">${money(i.outstanding)}</b></div><div class="s ellipsis">${esc(i.description || 'Money')} · ${i.dueDate < t ? 'was due ' : 'due '}${fmtDate(i.dueDate, { day: 'numeric', month: 'short' })}</div></div>
    <button class="mini-btn primary" data-pay="${i.friendId}" data-dir="${i.direction === 'receivable' ? 'received' : 'paid'}" data-target="${i.txnId}">${i.direction === 'receivable' ? 'Got it' : 'Paid'}</button></div>`;
  const w = openSheet('Reminder', `${recv.length ? `<div class="big-note" style="padding-top:0"><div class="e">${ic('arrowDown', 28)}</div><h4>Time to collect ${money(sum(recv, i => i.outstanding))}</h4><p class="small muted">Ask them to pay you back today.</p></div><div class="list">${recv.map(row).join('')}</div>` : ''}
    ${pay.length ? `<div class="section"><h2>You need to pay back</h2></div><div class="list">${pay.map(row).join('')}</div>` : ''}`,
    { footer: `<button class="btn primary" data-ok>Remind me tomorrow</button>`, onClose: () => seen() });
  // Count it as seen however it's dismissed — otherwise swiping it away makes it reappear after every save.
  const seen = () => { try { localStorage.setItem('hisaab.popup', JSON.stringify({ day: t, count: items.length })); } catch (e) { } };
  $('[data-ok]', w).onclick = () => closeSheet(w);
  $$('[data-pay]', w).forEach(b => b.onclick = () => { seen(); openSettle(b.dataset.pay, b.dataset.dir, b.dataset.target); });
}

function insights(R, id, rows, spent, s, inBy, outBy) {
  const out = [], lbl = R.label.toLowerCase();

  if (top && spent > 0) out.push(['chart', `${(D.catMap[top[0]] || {}).name || 'One type'} is ${pct(top[1], spent).toFixed(0)}% of your spending ${lbl}.`]);
  if (inBy[0]) out.push(['arrowDown', `Most money came from ${inBy[0][0].toLowerCase()} (${money(inBy[0][1])}) ${lbl}.`]);
  if (s.credits || s.debits) out.push([s.credits >= s.debits ? 'arrowDown' : 'arrowUp', s.credits >= s.debits ? `${money(r2(s.credits - s.debits))} more came in than went out ${lbl}.` : `${money(r2(s.debits - s.credits))} more went out than came in ${lbl}.`]);
  if (id === 'all' || id === DEFAULT_ACC) {
    const owing = Object.values(D.fr).filter(f => f.receivable > 0.004);
    if (owing.length) out.push(['handshake', `${money(D.totals.receivable)} is still to come back from ${owing.length} friend${owing.length > 1 ? 's' : ''}.`]);

}

function budgetAlerts(ms) {

function upcomingItems() {

  });
  S.d.ledger.forEach(i => {

    if (i.kind === 'loan' && i.dueDate && i.dueDate <= horizon) out.push({ kind: 'due', i, date: i.dueDate, title: (i.direction === 'receivable' ? 'Collect from ' : 'Pay back ') + friendName(i.friendId), sub: i.description, friendId: i.friendId, amount: i.outstanding, overdue: i.overdue, dir: i.direction });

/* ── Transaction rows & activity ── */
/** Amount shown on a row, from the point of view of the selected account: + green = in, − red = out, ⇄ blue = transfer. */
function txnAmount(t) {
  const id = selAcc(), A = money(t.amount);
  if (t.type === 'transfer') {
    if (id === 'all') return { v: '⇄ ' + A, cls: 'xfer', s: accShort(acctOf(t)) + ' → ' + accShort(t.toAccountId) };
    const inn = t.toAccountId === id;
    return { v: (inn ? '+' : '−') + A, cls: 'xfer', s: inn ? 'from ' + accShort(acctOf(t)) : 'to ' + accShort(t.toAccountId) };
  }
  if (t.type === 'income') return { v: '+' + A, cls: 'pos', s: t.payee ? t.payee : '' };
  if (t.type === 'expense') return { v: '−' + A, cls: 'neg', s: t.payee ? t.payee : '' };
  if (t.type === 'shared') { const me = myPart(t); return { v: '−' + money(me.paid || 0), cls: me.paid > 0 ? 'neg' : '', s: 'your share ' + money(me.share) }; }
  if (t.type === 'lent') { const o = sum(itemsFor(t.id), i => i.outstanding); return { v: '−' + A, cls: 'neg', s: o > 0 ? money(o) + ' to come back' : 'paid back ✓' }; }
  if (t.type === 'borrowed') { const o = sum(itemsFor(t.id), i => i.outstanding); return { v: '+' + A, cls: 'pos', s: o > 0 ? money(o) + ' to pay back' : 'paid back ✓' }; }
  return { v: (t.direction === 'received' ? '+' : '−') + A, cls: t.direction === 'received' ? 'pos' : 'neg', s: t.direction === 'received' ? 'money back' : 'paid back' };
}
function txnSub(t) {
  const c = D.catMap[t.category], f = D.friendMap[t.friendId];
  const tl = t.goalId ? 'Goal' : { expense: 'Spent', shared: 'Shared bill', lent: 'Gave money', borrowed: 'Took money', income: 'Money added', transfer: 'Transfer', repayment: t.direction === 'received' ? 'Got money back' : 'Paid back' }[t.type];
  const accTag = selAcc() === 'all' && t.type !== 'transfer' ? accShort(acctOf(t)) + ' · ' : '';
  if (t.type === 'transfer') return `Transfer · ${accById(acctOf(t)) ? accById(acctOf(t)).name : ''} → ${accById(t.toAccountId) ? accById(t.toAccountId).name : ''}`;
  if (t.type === 'income') return `${accTag}${tl}${t.payee ? ' · ' + t.payee : ''}`;
  if (t.type === 'shared') return `${accTag}${tl} · ${(t.splits || []).filter(s => s.personId !== 'me').map(s => friendName(s.personId)).join(', ')}${c ? ' · ' + c.name : ''}`;
  if (f) return `${accTag}${tl} · ${f.name}`;
  return `${accTag}${tl}${c ? ' · ' + c.name : ''}${t.paymentMethod ? ' · ' + t.paymentMethod : ''}`;
}
function txnRow(t, override) {
  const a = txnAmount(t);
  const overdue = (t.type === 'lent' || t.type === 'borrowed') && itemsFor(t.id).some(i => i.overdue);

function viewActivity() {
  const A = S.act, t = todayStr(), id = selAcc();
  let list = S.d.transactions.filter(x => id === 'all' || acctOf(x) === id || x.toAccountId === id);
  if (A.type) list = list.filter(x => x.type === A.type);
  if (A.friend) list = list.filter(x => x.friendId === A.friend || (x.splits || []).some(s => s.personId === A.friend));
  if (A.cat) list = list.filter(x => x.category === A.cat);
  if (A.range !== 'all') { const R = periodRange(A.range); list = list.filter(x => inRange(x.date, R.from, R.to)); }
  if (A.q) { const q = A.q.toLowerCase(); list = list.filter(x => (txnTitle(x) + ' ' + txnSub(x) + ' ' + (x.notes || '') + ' ' + (x.payee || '') + ' ' + (x.source || '') + ' ' + x.amount).toLowerCase().includes(q)); }
  list.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (a.createdAt < b.createdAt ? 1 : -1));
  const groups = {}; list.forEach(x => (groups[x.date] = groups[x.date] || []).push(x));
  const allowed = id === 'all' ? null : purposeOf(id).types;
  const types = [['', 'All'], ['income', 'Money in'], ['expense', 'Spent'], ['transfer', 'Transfers'], ['shared', 'Shared bills'], ['lent', 'Lent'], ['borrowed', 'Borrowed'], ['repayment', 'Paid back']].filter(([k]) => !k || !allowed || allowed.includes(k));
  const inSum = sum(list, x => { const f = flowsOf(x).find(z => id === 'all' ? z.kind !== 'transfer' : z.acc === id); return f && f.amt > 0 ? f.amt : 0; });
  const outSum = sum(list, x => { const f = flowsOf(x).find(z => id === 'all' ? z.kind !== 'transfer' : z.acc === id); return f && f.amt < 0 ? -f.amt : 0; });
  const friends = S.d.friends.slice().sort((a, b) => a.name.localeCompare(b.name));
  return `<div class="search"><input class="in" placeholder="Search name, friend, client, notes…" value="${esc(A.q)}" data-input="actQ" id="actQ"></div>
  <div class="chips" style="margin-top:10px">${types.map(([k, l]) => `<button class="chip ${A.type === k ? 'on' : ''}" data-act="actType" data-k="${k}">${l}</button>`).join('')}</div>
  <div class="row" style="margin-top:10px;gap:8px"><select class="in grow" data-change="actRange" style="max-width:180px">${[['all', 'All time'], ['this_month', 'This month'], ['last_month', 'Last month'], ['last_3', 'Last 3 months'], ['this_year', 'This year']].map(([k, l]) => `<option value="${k}" ${A.range === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
  <button class="filter-toggle" data-act="actFilterToggle">Filter${(A.friend || A.cat) ? ` <span class="badge">${(A.friend ? 1 : 0) + (A.cat ? 1 : 0)}</span>` : ''}</button></div>
  <div class="filters" id="actFilters" ${(A.friend || A.cat) ? '' : 'hidden'}>
    <select class="in" data-change="actFriend"><option value="">All friends</option>${friends.map(f => `<option value="${f.id}" ${A.friend === f.id ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select>
    <select class="in" data-change="actCat"><option value="">All types</option>${D.topCats.map(c => `<option value="${c.id}" ${A.cat === c.id ? 'selected' : ''}>${c.icon} ${esc(c.name)}</option>`).join('')}</select>
  </div>
  ${list.length ? `<div class="act-sum"><span>${list.length} entr${list.length === 1 ? 'y' : 'ies'}</span><span class="pos num">+${money(inSum)}</span><span class="neg num">−${money(outSum)}</span></div>` : ''}
  <div id="actList">${list.length ? Object.keys(groups).map(dt => `<div class="day">${esc(fmtDay(dt))}</div><div class="list">${groups[dt].map(x => txnRow(x)).join('')}</div>`).join('') : `<div class="list" style="margin-top:14px"><div class="empty"><div class="e">${ic('list', 26)}</div>${S.d.transactions.length ? 'Nothing matches these filters.' : 'No entries yet. Tap + to add your first one.'}</div></div>`}</div>
  <div style="height:10px"></div>`;
}

const sheetStack = [];
function openSheet(title, body, opts = {}) {
  const wrap = document.createElement('div');

  wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-h"><h3>${esc(title)}</h3><button class="x" data-close aria-label="Close">✕</button></div><div class="sheet-b">${body}</div>${opts.footer ? `<div class="sheet-f">${opts.footer}</div>` : ''}</div>`;
  wrap.addEventListener('click', e => { if (e.target === wrap || e.target.closest('[data-close]')) closeSheet(wrap); });
  $('#sheets').appendChild(wrap);
  sheetStack.push(wrap);
  // Runs however the sheet is dismissed: ✕, footer button, Escape, or a tap on the backdrop.
  if (opts.onClose) wrap._onClose = opts.onClose;
  if (opts.mount) opts.mount(wrap);
  return wrap;
}
function closeSheet(w) { w = w || sheetStack[sheetStack.length - 1]; if (!w) return; const i = sheetStack.indexOf(w); if (i > -1) sheetStack.splice(i, 1); const fn = w._onClose; w._onClose = null; w.remove(); if (fn) { try { fn(); } catch (e) { } } }
function closeAllSheets() { while (sheetStack.length) closeSheet(); }
function confirmSheet(title, msg, okLabel, danger) {
  return new Promise(res => {
    const w = openSheet(title, `<p style="margin:4px 0 4px">${msg}</p>`, { footer: `<button class="btn" data-no>Cancel</button><button class="btn primary" data-yes style="${danger ? 'background:var(--neg);color:#fff' : ''}">${esc(okLabel || 'Confirm')}</button>` });
    $('[data-no]', w).onclick = () => { closeSheet(w); res(false); };
    $('[data-yes]', w).onclick = () => { closeSheet(w); res(true); };
  });
}
